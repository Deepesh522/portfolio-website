<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with a Java Software Development Engineer">
  <meta name="keywords" content="Contact, Hire Java Developer, Software Engineer Contact">
  <title>Contact - Java SDE Portfolio</title>
  
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation -->
  <div id="navbar-placeholder"></div>

  <!-- Page Header -->
  <section class="hero" style="min-height: 50vh;">
    <div class="container hero-content">
      <h1 class="hero-title">Get in Touch</h1>
      <p class="hero-subtitle">Let's discuss your next project or opportunity</p>
    </div>
  </section>

  <!-- Contact Section -->
  <section class="section">
    <div class="container">
      <div class="grid grid-2" style="gap: var(--space-12);">
        
        <!-- Contact Information -->
        <div>
          <h2 class="mb-6">Contact Information</h2>
          
          <div class="card mb-6">
            <h3 class="card-title">📧 Email</h3>
            <p class="card-text" id="contact-email">Loading...</p>
            <a href="#" id="email-link" class="btn btn-secondary">Send Email</a>
          </div>

          <div class="card mb-6">
            <h3 class="card-title"> Phone</h3>
            <p class="card-text" id="contact-phone">Loading...</p>
            <!-- <a href="#" id="phone-link" class="btn btn-secondary">Call Now</a> -->
          </div>

          <div class="card mb-6">
            <h3 class="card-title">📍 Location</h3>
            <p class="card-text" id="contact-location">Loading...</p>
          </div>

          <div class="card">
            <h3 class="card-title">🔗 Connect</h3>
            <div style="display: flex; flex-direction: column; gap: var(--space-3);">
              <a href="#" id="github-link" target="_blank" class="btn btn-secondary">GitHub →</a>
              <a href="#" id="linkedin-link" target="_blank" class="btn btn-secondary">LinkedIn →</a>
              <a href="#" id="whatsapp-link" target="_blank" class="btn btn-secondary">WhatsApp →</a>
            </div>
          </div>
        </div>

        <!-- Contact Form -->
        <div>
          <h2 class="mb-6">Send a Message</h2>
          
          <div class="card">
            <form id="contact-form" onsubmit="handleContactSubmit(event)">
              <div class="form-group">
                <label for="contact-name" class="form-label">Your Name *</label>
                <input 
                  type="text" 
                  id="contact-name" 
                  class="form-input" 
                  placeholder="John Doe"
                  required
                >
              </div>

              <div class="form-group">
                <label for="contact-email" class="form-label">Your Email *</label>
                <input 
                  type="email" 
                  id="contact-email" 
                  class="form-input" 
                  placeholder="john@example.com"
                  required
                >
              </div>

              <div class="form-group">
                <label for="contact-subject" class="form-label">Subject *</label>
                <input 
                  type="text" 
                  id="contact-subject" 
                  class="form-input" 
                  placeholder="Project Inquiry"
                  required
                >
              </div>

              <div class="form-group">
                <label for="contact-message" class="form-label">Message *</label>
                <textarea 
                  id="contact-message" 
                  class="form-textarea" 
                  placeholder="Tell me about your project or opportunity..."
                  required
                  minlength="20"
                ></textarea>
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%;">
                Send Message
              </button>

              <p class="text-muted text-center mt-4" style="font-size: var(--text-sm);">
                I typically respond within 24 hours.
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/theme.js"></script>
  
  <!-- Page-specific script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Helper to safely set text content
      const setText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      };

      // Helper to safely set href
      const setHref = (id, href) => {
        const el = document.getElementById(id);
        if (el) el.href = href;
      };

      // Populate contact information
      setText('contact-email', portfolioData.personal.email);
      setText('contact-location', portfolioData.personal.location);
      
      // Set email link
      setHref('email-link', `mailto:${portfolioData.personal.email}`);
      
      // Set phone number
      setText('contact-phone', portfolioData.personal.phone);
      setHref('phone-link', `tel:${portfolioData.personal.phone}`);
      
      // Set social links
      setHref('github-link', portfolioData.personal.social.github);
      setHref('linkedin-link', portfolioData.personal.social.linkedin);
      setHref('whatsapp-link', portfolioData.personal.social.whatsapp);
    });
  </script>
</body>
</html>
