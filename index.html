    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/theme.js"></script>

    <!-- Page-specific script -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Populate hero section
        document.getElementById("hero-name").textContent =
          portfolioData.personal.name;
        document.getElementById("hero-tagline").textContent =
          portfolioData.personal.tagline;

        // Populate about section
        document.getElementById("about-bio").textContent =
          portfolioData.personal.bio;

        // Populate skills
        document.getElementById("skills-container").innerHTML =
          createSkillsSection();

        // Populate testimonials
        const testimonialsContainer = document.getElementById(
          "testimonials-container",
        );
        if (testimonialsContainer) {
            const approvedTestimonials = portfolioData.testimonials.filter(
              (t) => t.approved,
            );

            if (approvedTestimonials.length > 0) {
              testimonialsContainer.innerHTML = approvedTestimonials
                .map((testimonial) => createTestimonialCard(testimonial))
                .join("");
            } else {
              testimonialsContainer.innerHTML =
                '<p class="text-center text-muted">No testimonials yet. Be the first to share your thoughts!</p>';
            }
        }
      });
    </script>

    <!-- Add skill tag styles -->
    <style>
      .skill-tag {
        display: inline-block;
        padding: var(--space-2) var(--space-4);
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        font-size: var(--text-sm);
        font-weight: 500;
        color: var(--color-text);
        transition: all var(--transition-fast);
      }

      .skill-tag:hover {
        background: #6b8e23;
        color: white;
        border-color: #6b8e23;
        transform: translateY(-2px);
      }

      .tag {
        display: inline-block;
        padding: var(--space-1) var(--space-3);
        background: var(--color-surface-elevated);
        border-radius: var(--radius-full);
        font-size: var(--text-xs);
        color: var(--color-primary);
        font-weight: 600;
      }
