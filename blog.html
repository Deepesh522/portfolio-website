<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog posts about Java development, software engineering, and technology">
  <meta name="keywords" content="Java Blog, Software Engineering, Programming, Tech Articles">
  <title>Blog - Java SDE Portfolio</title>
  
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation -->
  <div id="navbar-placeholder"></div>

  <!-- Page Header -->
  <section class="hero" style="min-height: 50vh;">
    <div class="container hero-content">
      <h1 class="hero-title">Blog</h1>
      <p class="hero-subtitle">Thoughts on software development, Java, and technology</p>
    </div>
  </section>

  <!-- Blog Posts Section -->
  <section class="section">
    <div class="container">
      <div class="grid grid-2" id="blog-posts-container">
        Loading...
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/theme.js"></script>
  
  <!-- Page-specific script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const blogContainer = document.getElementById('blog-posts-container');
      
      if (portfolioData.blogPosts.length > 0) {
        // Sort by date (newest first)
        const sortedPosts = [...portfolioData.blogPosts].sort((a, b) => 
          new Date(b.date) - new Date(a.date)
        );
        
        blogContainer.innerHTML = sortedPosts
          .map(post => createBlogCard(post))
          .join('');
      } else {
        blogContainer.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: var(--space-16);">
            <h3>No blog posts yet</h3>
            <p class="text-muted">Check back soon for new content!</p>
          </div>
        `;
      }
    });
  </script>

  <style>
    .tag {
      display: inline-block;
      padding: var(--space-1) var(--space-3);
      background: var(--color-surface-elevated);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      color: var(--color-primary);
      font-weight: 600;
    }
  </style>
</body>
</html>
